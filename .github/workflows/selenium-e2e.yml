name: Selenium E2E

on:
  push:
    branches:
      - "tasnim/selenium"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/tests/e2e/**"
      - "backend/requirements-test.txt"
      - "frontend/**"
      - ".github/workflows/selenium-e2e.yml"
      - "docs/CAR-154-selenium.md"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional deployed URL to test instead of the local frontend build"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  selenium-e2e:
    name: Selenium UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      # Pushes and pull requests test the frontend built from the exact commit.
      # Deployed-site testing is opt-in via workflow_dispatch.target_url.
      CARELIFE_E2E_BASE_URL: ${{ inputs.target_url || 'http://127.0.0.1:4173' }}
      CARELIFE_HEADLESS: "true"
      CARELIFE_E2E_EMAIL: ${{ secrets.CARELIFE_E2E_EMAIL }}
      CARELIFE_E2E_PASSWORD: ${{ secrets.CARELIFE_E2E_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend from tested commit
        working-directory: frontend
        run: npm run build

      - name: Start frontend preview for Selenium
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/carelife-vite-preview.log 2>&1 &
          echo $! > /tmp/carelife-vite-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Frontend preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/carelife-vite-preview.log
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run Selenium regression suite
        run: |
          mkdir -p test-results
          python -m pytest -q tests/e2e \
            --junitxml=test-results/e2e-results.xml

      - name: Upload Selenium evidence and JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-results-${{ github.run_id }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 14

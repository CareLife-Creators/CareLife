name: Selenium E2E

on:
  push:
    branches:
      - "tasnim/selenium"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/tests/e2e/**"
      - "backend/requirements-test.txt"
      - ".github/workflows/selenium-e2e.yml"
      - "docs/CAR-154-selenium.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-site-e2e:
    name: Deployed-site Selenium tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      CARELIFE_E2E_BASE_URL: ${{ vars.CARELIFE_E2E_BASE_URL || 'https://carelife-web.onrender.com' }}
      CARELIFE_HEADLESS: "true"
      CARELIFE_E2E_EMAIL: ${{ secrets.CARELIFE_E2E_EMAIL }}
      CARELIFE_E2E_PASSWORD: ${{ secrets.CARELIFE_E2E_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run deployed-site browser tests
        run: |
          mkdir -p test-results
          python -m pytest -q tests/e2e \
            --junitxml=test-results/e2e-results.xml

      - name: Upload Selenium evidence and JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-results-${{ github.run_id }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 14
